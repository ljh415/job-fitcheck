services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./data:/app/data
      # RAG 로컬 임베딩 provider(선택, RAG_GUIDE.md 참고)를 쓰려면 SSH 개인키를 컨테이너
      # 안 같은 경로로 마운트해야 함 — 개인 키 경로라 기본으로는 주석 처리해둠, 필요하면
      # 아래 줄의 경로를 자기 키 경로로 바꾸고 주석만 해제할 것:
      # - /home/you/.ssh/your_key:/home/you/.ssh/your_key:ro
    restart: unless-stopped

  rag-postgres:
    # RAG(Agentic RAG) 기능용 PostgreSQL+pgvector — opt-in. 기본 `docker compose up`에는 안 뜨고,
    # RAG를 쓰려는 사용자만 `docker compose --profile rag up`으로 함께 띄운다. `.env`에
    # RAG_POSTGRES_HOST=rag-postgres 등을 설정해야 앱이 이 서비스를 실제로 사용한다.
    profiles: ["rag"]
    image: pgvector/pgvector:pg17
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${RAG_POSTGRES_DB:-rag}
      - POSTGRES_USER=${RAG_POSTGRES_USER:-rag}
      - POSTGRES_PASSWORD=${RAG_POSTGRES_PASSWORD:-rag}
    volumes:
      - rag_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RAG_POSTGRES_USER:-rag} -d ${RAG_POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  rag_pg_data:
