<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RAG 테스트 — Job FitCheck</title>
<link rel="stylesheet" href="/style.css" />
<style>
  body { max-width: 720px; margin: 40px auto; padding: 0 20px; }
  .rag-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .rag-header h2 { margin: 0; }
  .rag-form { display: flex; gap: 8px; margin-bottom: 20px; }
  .rag-form input[type="text"] { flex: 1 1 auto; width: auto; min-width: 0; padding: 10px 12px; border: 1px solid var(--border-input); border-radius: 6px; background: var(--bg-surface); color: var(--text); }
  .rag-form select { flex: 0 0 auto; width: auto; padding: 10px 12px; border: 1px solid var(--border-input); border-radius: 6px; background: var(--bg-surface); color: var(--text); }
  .rag-form button { padding: 10px 18px; border: none; border-radius: 6px; background: var(--primary); color: var(--text-inverse); cursor: pointer; }
  .rag-form button:disabled { opacity: .6; cursor: default; }
  .rag-result { border: 1px solid var(--border); border-radius: 8px; padding: 20px; background: var(--bg-surface); }
  .rag-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .85em; font-weight: 600; }
  .rag-badge.strong { background: #dcfce7; color: #166534; }
  .rag-badge.partial { background: #fef9c3; color: #854d0e; }
  .rag-badge.adjacent { background: #dbeafe; color: #1e40af; }
  .rag-badge.none { background: #fee2e2; color: #991b1b; }
  .rag-section { margin-top: 16px; }
  .rag-section h4 { margin: 0 0 6px; color: var(--text-secondary); }
  .rag-excerpt { font-size: .9em; color: var(--text-muted); border-left: 3px solid var(--border); padding-left: 10px; margin: 6px 0; }
  .rag-error { color: #991b1b; background: #fee2e2; padding: 10px 14px; border-radius: 6px; }
  .rag-loading { color: var(--text-muted); padding: 10px 14px; border-radius: 6px; background: var(--bg-surface); border: 1px dashed var(--border); }
  .rag-note { font-size: .85em; color: var(--text-dimmed); margin-top: 24px; }
  .rag-divider { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
  .rag-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .rag-table th, .rag-table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: .9em; }
  .rag-chat-panel { height: 560px; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: var(--bg-surface); }
  .rag-chat-panel .qa-input-row { border-top: 1px solid var(--border); }
  .rag-chat-panel .qa-input-row input[type="text"] { flex: 1 1 auto; width: auto; min-width: 0; padding: 10px 12px; border: 1px solid var(--border-input); border-radius: 6px; background: var(--bg-surface); color: var(--text); }
  .rag-chat-panel .qa-input-row select { flex: 0 0 auto; width: auto; padding: 10px 12px; border: 1px solid var(--border-input); border-radius: 6px; background: var(--bg-surface); color: var(--text); }
  .rag-chat-panel .qa-input-row button { flex: 0 0 auto; width: auto; white-space: nowrap; padding: 10px 18px; border: none; border-radius: 6px; background: var(--primary); color: var(--text-inverse); cursor: pointer; }
  .rag-chat-panel .qa-input-row button:disabled { opacity: .6; cursor: default; }
  .qa-bubble.assistant { max-width: 95%; }
  .qa-bubble.assistant .rag-section:first-child { margin-top: 0; }
</style>
</head>
<body>

<div class="rag-header">
  <h2>🧪 RAG 테스트</h2>
  <button id="theme-toggle-btn" onclick="toggleTheme()" title="다크모드 전환">🌙</button>
</div>

<p class="rag-note">Plan A 6~7단계(Gap 판정 + 행동 계획) 파이프라인을 직접 호출하는 테스트 화면입니다. rag/main 브랜치 전용 — main 브랜치엔 없습니다.</p>

<h3>기술명으로 바로 확인</h3>
<form class="rag-form" onsubmit="runGapCheck(event)">
  <input type="text" id="skill-input" placeholder="기술/개념 (예: GCP, CI/CD, Kubernetes)" required />
  <select id="provider-select">
    <option value="google">Google</option>
    <option value="local">Local</option>
  </select>
  <button type="submit" id="submit-btn">확인</button>
</form>

<div id="result"></div>

<hr class="rag-divider" />

<h3>자연어로 질문하기 (대화형 근거 기반 RAG — Phase 1~4)</h3>
<div class="rag-form">
  <select id="chat-select" onchange="switchChat(this.value)"></select>
  <button type="button" id="new-chat-btn" onclick="createNewChat()">+ 새 채팅</button>
</div>
<div class="rag-chat-panel">
  <div id="ask-result" class="qa-messages"></div>
  <form class="qa-input-row" onsubmit="runAsk(event)">
    <input type="text" id="question-input" placeholder="예: AWS를 안 해봤으면 단점이 될까? / Redis 요구하는 공고 어디어디야? / (이어서) 그중에서 몇 개야?" required />
    <select id="ask-provider-select">
      <option value="google">Google</option>
      <option value="local">Local</option>
    </select>
    <button type="submit" id="ask-submit-btn">전송</button>
  </form>
</div>

<script>
const saved = localStorage.getItem('job-fitcheck-theme');
if (saved === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('theme-toggle-btn').textContent = '☀️';
}
function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const btn = document.getElementById('theme-toggle-btn');
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    btn.textContent = '🌙';
    localStorage.setItem('job-fitcheck-theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    btn.textContent = '☀️';
    localStorage.setItem('job-fitcheck-theme', 'dark');
  }
}

const LEVEL_CLASS = {
  '직접 근거': 'strong',
  '부분 근거': 'partial',
  '인접 경험': 'adjacent',
  '근거 없음': 'none',
};

async function runGapCheck(event) {
  event.preventDefault();
  const skill = document.getElementById('skill-input').value.trim();
  const provider = document.getElementById('provider-select').value;
  const btn = document.getElementById('submit-btn');
  const resultEl = document.getElementById('result');
  if (!skill) return;

  btn.disabled = true;
  btn.textContent = '확인 중...';
  resultEl.innerHTML = '';

  try {
    const token = localStorage.getItem('job-fitcheck-token');
    const res = await fetch('/api/rag/gap-check', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
      },
      body: JSON.stringify({ skill, provider }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `요청 실패 (${res.status})`);
    }
    const data = await res.json();
    render(data);
  } catch (e) {
    resultEl.innerHTML = `<div class="rag-error">${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '확인';
  }
}

function renderGapCard(data) {
  const badgeClass = LEVEL_CLASS[data.evidence_level] || 'none';
  const demand = data.market_demand;
  let html = `
    <h3>${escapeHtml(data.skill)} <span class="rag-badge ${badgeClass}">${escapeHtml(data.evidence_level)}</span></h3>
    <div class="rag-section">
      <h4>시장 수요 ${demand.method === 'exact' ? '' : '<span class="rag-badge partial">추정치</span>'}</h4>
      <p>${demand.method === 'exact'
        ? `전체 공고 ${demand.total}건 중 ${demand.matched}건 요구 (${(demand.ratio * 100).toFixed(1)}%)`
        : `약 ${demand.matched}건 / 전체 ${demand.total}건 (${(demand.ratio * 100).toFixed(1)}%) — 임베딩+키워드 검색으로 모은 후보 ${demand.candidate_count ?? '?'}건 중 LLM이 판정한 추정치입니다. 정확한 전수 집계가 아닙니다.`}</p>
    </div>
    <div class="rag-section">
      <h4>판정 근거</h4>
      <p>${escapeHtml(data.reasoning)}</p>
    </div>
  `;
  if (data.excerpts && data.excerpts.length) {
    html += `<div class="rag-section"><h4>검색된 프로필 발췌문 (${data.excerpts.length}건)</h4>`;
    for (const e of data.excerpts) {
      html += `<div class="rag-excerpt">${escapeHtml(e)}</div>`;
    }
    html += `</div>`;
  }
  if (data.action_plan) {
    const ap = data.action_plan;
    html += `
      <div class="rag-section">
        <h4>행동 계획</h4>
        <p><strong>활동:</strong> ${escapeHtml(ap.activity)}</p>
        <p><strong>남길 증거:</strong> ${escapeHtml(ap.evidence_to_produce)}</p>
        <p><strong>완료 조건:</strong> ${escapeHtml(ap.completion_criteria)}</p>
      </div>
    `;
  }
  return html;
}

function renderSkillEvidenceCard(g) {
  const badgeClass = LEVEL_CLASS[g.evidence_level] || 'none';
  let html = `<div class="rag-excerpt"><strong>${escapeHtml(g.skill)}</strong> — <span class="rag-badge ${badgeClass}">${escapeHtml(g.evidence_level)}</span>`;
  if (g.reasoning) {
    html += `<p>${escapeHtml(g.reasoning)}</p>`;
  }
  if (g.excerpts && g.excerpts.length) {
    html += g.excerpts.map(e => `<p class="rag-note">발췌: ${escapeHtml(e)}</p>`).join('');
  }
  html += `</div>`;
  return html;
}

function render(data) {
  const html = `<div class="rag-result">${renderGapCard(data)}<p class="rag-note">provider: ${escapeHtml(data.provider)}</p></div>`;
  document.getElementById('result').innerHTML = html;
}

const RAG_CHATS_KEY = 'job-fitcheck-rag-chats';
const RAG_CURRENT_CHAT_KEY = 'job-fitcheck-rag-current-chat';

function loadChats() {
  return JSON.parse(localStorage.getItem(RAG_CHATS_KEY) || '{}');
}
function saveChats(chats) {
  localStorage.setItem(RAG_CHATS_KEY, JSON.stringify(chats));
}
function getCurrentChatId() {
  return localStorage.getItem(RAG_CURRENT_CHAT_KEY);
}
function setCurrentChatId(id) {
  localStorage.setItem(RAG_CURRENT_CHAT_KEY, id);
}

function createNewChat() {
  const chats = loadChats();
  const id = `chat-${Date.now()}`;
  chats[id] = { title: null, createdAt: Date.now(), messages: [], sessionState: null };
  saveChats(chats);
  setCurrentChatId(id);
  document.getElementById('question-input').value = '';
  renderChatDropdown();
  renderThread([]);
}

function renderChatDropdown() {
  const chats = loadChats();
  const select = document.getElementById('chat-select');
  let ids = Object.keys(chats).sort((a, b) => chats[b].createdAt - chats[a].createdAt);
  if (ids.length === 0) {
    createNewChat();
    return;
  }
  let current = getCurrentChatId();
  if (!current || !chats[current]) {
    current = ids[0];
    setCurrentChatId(current);
  }
  select.innerHTML = ids.map(id => {
    const title = chats[id].title || '(새 채팅)';
    return `<option value="${id}" ${id === current ? 'selected' : ''}>${escapeHtml(title)}</option>`;
  }).join('');
}

function switchChat(chatId) {
  setCurrentChatId(chatId);
  const chats = loadChats();
  renderThread((chats[chatId] && chats[chatId].messages) || []);
}

function renderThread(messages) {
  const resultEl = document.getElementById('ask-result');
  resultEl.className = 'qa-messages';
  resultEl.innerHTML = messages.map(m => `
    <div class="qa-bubble user">${escapeHtml(m.question)}</div>
    <div class="qa-bubble assistant">${renderAskAnswer(m.data)}</div>
  `).join('');
  resultEl.scrollTop = resultEl.scrollHeight;
}

async function runAsk(event) {
  event.preventDefault();
  const question = document.getElementById('question-input').value.trim();
  const provider = document.getElementById('ask-provider-select').value;
  const btn = document.getElementById('ask-submit-btn');
  const resultEl = document.getElementById('ask-result');
  if (!question) return;

  const chats = loadChats();
  const chatId = getCurrentChatId();
  const chat = chats[chatId];

  btn.disabled = true;
  btn.textContent = '전송 중...';
  resultEl.className = 'qa-messages';
  resultEl.innerHTML += `
    <div class="qa-bubble user">${escapeHtml(question)}</div>
    <div class="qa-bubble assistant rag-loading">답변을 생성하고 있습니다. 질문 종류에 따라 최대 30~40초 정도 걸릴 수 있습니다...</div>
  `;
  resultEl.scrollTop = resultEl.scrollHeight;

  try {
    const token = localStorage.getItem('job-fitcheck-token');
    const res = await fetch('/api/rag/ask', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
      },
      body: JSON.stringify({ question, provider, session_state: chat.sessionState }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `요청 실패 (${res.status})`);
    }
    const data = await res.json();
    chat.messages.push({ question, data });
    chat.sessionState = data.session_state || null;
    if (!chat.title) chat.title = question.slice(0, 24) + (question.length > 24 ? '…' : '');
    saveChats(chats);
    renderChatDropdown();
    renderThread(chat.messages);
    document.getElementById('question-input').value = '';
  } catch (e) {
    renderThread(chat.messages);
    resultEl.innerHTML += `<div class="rag-error">${escapeHtml(e.message)}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '전송';
  }
}

function renderAskAnswer(data) {
  const typeLabel = {
    single_skill_gap: '단일 기술 Gap', all_gaps: '전체 Gap·강점', market_aggregate: '시장 수요 통계',
    action_plan: '행동 계획', posting_list: '공고 목록', posting_comparison: '공고 비교', unanswerable: '답변 불가',
  }[data.query_type] || data.query_type;
  let inner = `<p class="rag-note">분류: <strong>${escapeHtml(typeLabel)}</strong></p>`;

  if (data.query_type === 'single_skill_gap') {
    inner += renderGapCard(data);
  } else if (data.query_type === 'all_gaps') {
    inner += '<div class="rag-section"><h4>우선순위 Gap</h4>' + (data.priority_gaps || []).map(renderSkillEvidenceCard).join('') + '</div>';
    inner += '<div class="rag-section"><h4>강점</h4>' + (data.strengths || []).map(renderSkillEvidenceCard).join('') + '</div>';
  } else if (data.query_type === 'market_aggregate') {
    const demand = data.market_demand;
    const methodNote = demand.method === 'exact'
      ? '정확 매칭(구조화 데이터 기준, 전체 공고 대상)'
      : `LLM 추정 판정(검색으로 모은 후보 ${demand.candidate_count}건만 대상 — 전체 공고를 다 본 결과가 아님)`;
    inner += `<div class="rag-section"><h4>${escapeHtml(data.skill)} 시장 수요</h4><p>전체 공고 ${demand.total}건 중 ${demand.matched}건 요구 (${(demand.ratio * 100).toFixed(1)}%)</p><p class="rag-note">${escapeHtml(methodNote)}</p></div>`;
  } else if (data.query_type === 'action_plan') {
    inner += '<div class="rag-section"><h4>우선순위 Gap</h4>' + (data.priority_gaps || []).map(renderSkillEvidenceCard).join('') + '</div>';
    if (data.plan) {
      inner += '<div class="rag-section"><h4>순서 계획</h4>' + (data.plan.phases || []).map(p => `<div class="rag-excerpt"><strong>${p.order}단계</strong> (${escapeHtml((p.skills || []).join(', '))}) — ${escapeHtml(p.activity)}<br/>완료조건: ${escapeHtml(p.completion_criteria)}</div>`).join('') + '</div>';
    }
  } else if (data.query_type === 'posting_list') {
    const postings = data.postings || [];
    const hasEvidence = postings.some(p => p.evidence);
    const rows = postings.map(p => `<tr><td>${escapeHtml(p.company_name)}</td><td>${escapeHtml(p.job_title)}</td>${hasEvidence ? `<td>${escapeHtml(p.evidence || '(정확 매칭 — 근거 문장 없음)')}</td>` : ''}</tr>`).join('');
    const evidenceHeader = hasEvidence ? '<th>판정 근거</th>' : '';
    inner += `<div class="rag-section"><h4>공고 목록 (${postings.length}건)</h4><table class="rag-table"><tr><th>회사</th><th>직무</th>${evidenceHeader}</tr>${rows}</table></div>`;
  } else if (data.query_type === 'posting_comparison') {
    inner += '<div class="rag-section"><h4>공고 비교</h4>' + (data.comparison || []).map(c => c.found
      ? `<div class="rag-excerpt"><strong>${escapeHtml(c.company_name)}</strong> — ${escapeHtml(c.job_title || '')}<br/>기술스택: ${escapeHtml((c.tech_stack || []).join(', ') || '정보 없음')}<br/>잡플래닛: ${c.jobplanet_score ?? '정보 없음'} / 적합도: ${c.fit_score ?? '정보 없음'}</div>`
      : `<div class="rag-excerpt">"${escapeHtml(c.query)}" 관련 공고를 찾지 못했습니다.</div>`).join('') + '</div>';
  } else {
    inner += `<div class="rag-section"><p>${escapeHtml(data.message || '답변할 수 없는 질문입니다.')}</p></div>`;
  }

  inner += `<p class="rag-note">provider: ${escapeHtml(data.provider)}</p>`;
  return inner;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}

renderChatDropdown();
switchChat(getCurrentChatId());
</script>

</body>
</html>
